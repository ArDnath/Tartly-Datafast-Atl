name: Validate open-source release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: talivia_ci
          POSTGRES_USER: talivia
          POSTGRES_PASSWORD: talivia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talivia -d talivia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://talivia:talivia@localhost:5432/talivia_ci
      APP_SECRET: ci-only-secret-not-for-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check tag against package version
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.10.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-db
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec prisma migrate deploy
      - run: pnpm build
