name: CI

# Every pull request and every push to main must pass the same gate. The
# deploy workflow only runs after this workflow succeeds on main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.10.0'
  NEXT_TELEMETRY_DISABLED: '1'
  APP_SECRET: ci-only-secret-not-for-production-0123456789
  DATABASE_URL: postgresql://talivia:talivia@localhost:5432/talivia_ci

jobs:
  verify:
    name: Verify (format, lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: talivia_ci
          POSTGRES_USER: talivia
          POSTGRES_PASSWORD: talivia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talivia -d talivia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate database client
        run: pnpm build-db

      - name: Format check
        run: pnpm exec biome format .

      - name: Lint
        run: pnpm exec biome lint .

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Apply migrations to the CI database
        run: pnpm exec prisma migrate deploy

      - name: PostgreSQL analytics smoke
        run: pnpm exec vitest run --config vitest.phase7.config.ts src/features/analytics/server/queries/phase7-analytics-smoke.test.ts
        env:
          RUN_PHASE7_DB_SMOKE: '1'
          PHASE7_DATABASE_URL: postgresql://talivia:talivia@localhost:5432/talivia_ci

      - name: Production build
        run: pnpm build
        env:
          SKIP_DB_CHECK: '1'

  security:
    name: Security (secrets, CodeQL, dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:javascript-typescript

      - name: Filesystem and configuration scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: node_modules,.next,coverage,generated,public/script.js,public/recorder.js
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # This step is last so a dependency-graph setting problem cannot skip the
      # CodeQL and Trivy scans above. The graph has since been enabled, so the
      # step is blocking again.
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  container:
    name: Container build and image scan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: tartly:ci-${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy's SARIF mode collects every severity by default, so a plain
      # `severity: CRITICAL` scan still exits 1 on medium findings. Keep the
      # blocking gate to CRITICAL/HIGH and upload the complete inventory in a
      # separate non-blocking scan for visibility.
      - name: Scan image for blocking findings (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tartly:ci-${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: 'true'
          format: sarif
          output: trivy-image-blocking.sarif
          exit-code: '1'

      - name: Upload blocking image scan SARIF
        if: always() && hashFiles('trivy-image-blocking.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-image-blocking.sarif
          category: trivy-image-blocking

      - name: Full image inventory (advisory)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tartly:ci-${{ github.sha }}
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          exit-code: '0'

      - name: Upload full image inventory SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
