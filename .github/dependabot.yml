version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase
    # The formatter is pinned exactly. A patch bump can change how it prints
    # Markdown (2.6.7 re-indents list continuations), which fails the format gate
    # on every dependency PR. Upgrade Biome deliberately, reformat the repo in
    # the same PR, then raise the pin.
    ignore:
      - dependency-name: "@biomejs/biome"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      runtime-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      build-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: ["@biomejs/biome"]
    labels: [dependencies, security]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: UTC
    open-pull-requests-limit: 3
    labels: [dependencies, containers]
